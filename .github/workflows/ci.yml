name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Cheapest gate first: the toolchain pinned in mise.toml must match the
      # Dockerfile base images (ADR 0006). Pure text check, no toolchain needed.
      - name: Toolchain lockstep (mise vs Dockerfile)
        run: bash scripts/check-toolchain.sh
      # Installs Java + Maven from the committed mise.toml — same toolchain
      # as local dev, so CI is the authoritative backstop, not a divergence.
      - uses: jdx/mise-action@v4
      - run: mvn -B -ntp verify

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: railway up --ci --service mavis
