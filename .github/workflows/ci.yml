name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs Java + Maven from the committed mise.toml — same toolchain
      # as local dev, so CI is the authoritative backstop, not a divergence.
      - uses: jdx/mise-action@v4
      - run: mvn -B -ntp verify
